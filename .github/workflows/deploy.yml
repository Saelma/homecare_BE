name: Deploy to Amazon EC2

on:
  push:
    branches: [ "main", "dev" ] # 메인 브랜치에 푸시될 때 작동

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 캐싱을 사용해 빌드 속도를 높입니다.
      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 1. 빌드 (테스트 제외하고 빠르게)
      - name: Build with Gradle
        run: |
          cd homecare
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      # 2. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker 이미지 빌드 및 푸시
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./homecare
          file: ./homecare/Dockerfile # 아까 성공했던 그 Dockerfile 경로!
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/homecare-backend:latest

      # 4. EC2 접속 및 배포
      - name: EC2 Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/workspace/homecare_infra/code
            
            echo "AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}" > .env
            echo "AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}" >> .env
            
            docker-compose pull homecare-backend
            docker-compose up -d homecare-backend
            docker image prune -f
